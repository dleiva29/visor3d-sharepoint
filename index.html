<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor anatómico 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #17212b;
      font: 15px system-ui, sans-serif;
    }

    #app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #viewer {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #panel {
      width: 290px;
      padding: 20px;
      background: #f7f9fb;
      border-left: 1px solid #dce2e8;
      overflow-y: auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    h2 {
      margin-top: 24px;
      font-size: 16px;
    }

    button {
      padding: 10px 14px;
      border: 1px solid #c8d1db;
      border-radius: 7px;
      background: #ffffff;
      color: #17212b;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #eaf0f6;
    }

    .layer {
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #dce2e8;
      border-radius: 8px;
      background: #ffffff;
    }

    .layer-title {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 13px;
    }

    .setting input[type="range"] {
      flex: 1;
      min-width: 0;
    }

    input[type="color"] {
      width: 42px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    #status,
    .help {
      font-size: 13px;
      line-height: 1.5;
      color: #526171;
    }

    #status {
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    #status.error {
      color: #b42318;
    }

    @media (max-width: 650px) {
      #app {
        flex-direction: column;
      }

      #viewer {
        flex: none;
        height: 60%;
      }

      #panel {
        width: 100%;
        flex: 1;
        border-left: 0;
        border-top: 1px solid #dce2e8;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <main id="app">
    <div id="viewer" aria-label="Vista del modelo 3D"></div>

    <aside id="panel">
      <h1>Visor anatómico 3D</h1>

      <button id="reset" type="button" disabled>
        Restablecer vista
      </button>

      <p id="status" role="status" aria-live="polite">
        Cargando visor…
      </p>

      <h2>Estructuras</h2>
      <div id="layers"></div>

      <p class="help">
        Rotar: arrastrar con el botón izquierdo.<br>
        Zoom: rueda del ratón.<br>
        Desplazar: arrastrar con el botón derecho.
      </p>
    </aside>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from
      'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from
      'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('viewer');
    const layers = document.getElementById('layers');
    const status = document.getElementById('status');
    const resetButton = document.getElementById('reset');

    function showError(message, error) {
      status.textContent = message;
      status.classList.add('error');

      if (error) {
        console.error(error);
      }
    }

    async function start() {
      const renderer = new THREE.WebGLRenderer({
        antialias: true
      });

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
      );

      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#ffffff');

      const camera = new THREE.PerspectiveCamera(
        45,
        1,
        0.01,
        100000
      );

      const controls = new OrbitControls(
        camera,
        renderer.domElement
      );

      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.screenSpacePanning = true;

      scene.add(
        new THREE.HemisphereLight(0xffffff, 0x8899aa, 2)
      );

      const mainLight = new THREE.DirectionalLight(
        0xffffff,
        2.5
      );

      mainLight.position.set(1, 2, 3);
      camera.add(mainLight);
      scene.add(camera);

      const fillLight = new THREE.DirectionalLight(
        0xffffff,
        1
      );

      fillLight.position.set(-2, 1, -1);
      scene.add(fillLight);

      function resize() {
        const width = Math.max(container.clientWidth, 1);
        const height = Math.max(container.clientHeight, 1);

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
      }

      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(container);
      resize();

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });

      resetButton.addEventListener('click', () => {
        controls.reset();
      });

      // Ejemplo:
      // ?modelo=modelos/modelo_001.glb
      const parameters = new URLSearchParams(
        window.location.search
      );

      const modelPath =
        parameters.get('modelo') || './modelo-demo.glb';

      const baseURL = new URL('./', window.location.href);
      const modelURL = new URL(modelPath, baseURL);

      // Limitar la carga a archivos GLB del mismo proyecto.
      if (
        modelURL.origin !== baseURL.origin ||
        !modelURL.pathname.startsWith(baseURL.pathname) ||
        !modelURL.pathname.toLowerCase().endsWith('.glb')
      ) {
        throw new Error(
          'La ruta debe apuntar a un archivo GLB dentro de este proyecto.'
        );
      }

      const filename = decodeURIComponent(
        modelURL.pathname.split('/').pop()
      );

      document.title = `${filename} — Visor 3D`;
      status.textContent = `Cargando ${filename}…`;

      const loader = new GLTFLoader();

      const gltf = await loader.loadAsync(
        modelURL.href,
        (progress) => {
          if (progress.total > 0) {
            const percent = Math.round(
              progress.loaded / progress.total * 100
            );

            status.textContent =
              `Cargando ${filename}: ${percent}%`;
          }
        }
      );

      const model = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(model);

      if (bounds.isEmpty()) {
        throw new Error('El modelo no contiene geometría visible.');
      }

      const center = bounds.getCenter(new THREE.Vector3());
      const dimensions = bounds.getSize(new THREE.Vector3());
      const radius = dimensions.length() / 2;

      if (!Number.isFinite(radius) || radius <= 0) {
        throw new Error('El tamaño del modelo no es válido.');
      }

      scene.add(model);

      // Centrar el conjunto, conservando la posición relativa
      // de todas sus estructuras.
      const pivot = new THREE.Group();
      scene.add(pivot);
      pivot.add(model);
      pivot.position.copy(center).multiplyScalar(-1);

      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(
        Math.tan(verticalFov / 2) * camera.aspect
      );

      const distance = radius / Math.sin(
        Math.min(verticalFov, horizontalFov) / 2
      ) * 1.15;

      camera.position.copy(
        new THREE.Vector3(1, 0.6, 1)
          .normalize()
          .multiplyScalar(distance)
      );

      camera.near = Math.max(radius / 1000, 0.0001);
      camera.far = Math.max(distance + radius * 100, 100);
      camera.updateProjectionMatrix();

      controls.target.set(0, 0, 0);
      controls.minDistance = radius * 0.05;
      controls.maxDistance = radius * 50;
      controls.update();
      controls.saveState();

      resetButton.disabled = false;

      // Agrupar mallas que compartan el mismo nombre.
      const structures = new Map();

      model.traverse((object) => {
        if (!object.isMesh) return;

        // Cada malla recibe materiales propios para que sus
        // controles no modifiquen otras estructuras.
        const originals = Array.isArray(object.material)
          ? object.material
          : [object.material];

        const materials = originals.map((material) => {
          const copy = material.clone();
          copy.side = THREE.DoubleSide;
          return copy;
        });

        object.material = Array.isArray(object.material)
          ? materials
          : materials[0];

        const name =
          object.name ||
          object.parent?.name ||
          `Estructura ${structures.size + 1}`;

        if (!structures.has(name)) {
          structures.set(name, []);
        }

        structures.get(name).push(object);
      });

      if (structures.size === 0) {
        throw new Error('No se han encontrado superficies en el GLB.');
      }

      for (const [name, meshes] of structures) {
        const materials = meshes.flatMap((mesh) =>
          Array.isArray(mesh.material)
            ? mesh.material
            : [mesh.material]
        );

        const card = document.createElement('div');
        card.className = 'layer';

        const title = document.createElement('label');
        title.className = 'layer-title';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = meshes.every((mesh) => mesh.visible);

        const text = document.createElement('span');
        text.textContent = name;

        title.append(checkbox, text);

        checkbox.addEventListener('change', () => {
          meshes.forEach((mesh) => {
            mesh.visible = checkbox.checked;
          });
        });

        const colorRow = document.createElement('label');
        colorRow.className = 'setting';

        const colorText = document.createElement('span');
        colorText.textContent = 'Color';

        const color = document.createElement('input');
        color.type = 'color';

        const firstColor = materials.find(
          (material) => material.color
        )?.color;

        color.value = firstColor
          ? `#${firstColor.getHexString()}`
          : '#cccccc';

        color.addEventListener('input', () => {
          materials.forEach((material) => {
            if (material.color) {
              material.color.set(color.value);
            }
          });
        });

        colorRow.append(colorText, color);

        const opacityRow = document.createElement('label');
        opacityRow.className = 'setting';

        const opacityText = document.createElement('span');
        opacityText.textContent = 'Opacidad';

        const opacity = document.createElement('input');
        opacity.type = 'range';
        opacity.min = '0';
        opacity.max = '100';
        opacity.step = '1';
        opacity.value = String(
          Math.round((materials[0]?.opacity ?? 1) * 100)
        );

        const opacityValue = document.createElement('span');
        opacityValue.textContent = `${opacity.value}%`;

        opacity.addEventListener('input', () => {
          const value = Number(opacity.value) / 100;

          materials.forEach((material) => {
            material.opacity = value;
            material.transparent = value < 1;
            material.depthWrite = value >= 1;
            material.needsUpdate = true;
          });

          opacityValue.textContent = `${opacity.value}%`;
        });

        opacityRow.append(
          opacityText,
          opacity,
          opacityValue
        );

        card.append(title, colorRow, opacityRow);
        layers.appendChild(card);
      }

      status.textContent =
        `${filename} · ${structures.size} estructuras`;
    }

    start().catch((error) => {
      showError(
        `No se pudo abrir el modelo. Comprueba la ruta del GLB ` +
        `y que el archivo exista en GitHub. ${error.message}`,
        error
      );
    });
  </script>
</body>
</html>
